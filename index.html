<div class="th-host" id="host-ion"></div>

<!-- ===== 主题 08 · ION 离子回路 ===== -->
<template id="tpl-ion">
<style>
/* Layout: 全屏决策电路 —— 整个画面就是一面斜着退向远处的「决策卡墙」：6 列 = 一个 Agent 做决定的 6 个环节（状态 → 提问 → 推理 → 决策 → 闸门 → 执行），
   列与列之间是竖直的等离子母线，卡片之间走着电路走线，离子沿线高速穿行，整面墙一直缓缓上滑。每跑一个任务，离子光球从左到右一列一列点亮决策节点，
   整面电路换成这个任务的颜色，跑完后整面墙快速甩到下一段。标题、用例、读数都不加框，浮在电路上，用焊盘和走线接进电路。左上标题、右上按钮与前几款同一套写法。
   决策卡是 DOM（透视用 matrix3d 贴上去，文字清楚），等离子与离子流是原生 WebGL（带泛光）叠加在卡片上（screen 混合），不依赖 three.js。 */
:host{
  color-scheme:dark;
  --bg:#07060b; --panel:rgba(11,9,17,.84); --card:rgba(16,13,24,.86); --sh:5,4,9; --hold:#ffb020;
  --line:rgba(200,190,255,.1); --line-2:rgba(210,200,255,.24);
  --fg:#ece8f6; --fg-2:#a49fb6; --fg-3:#69647c; --ok:#5dffa8;
  --c0:#ff3d1f; --hi:#ffd23f; --fil:#ff8a3d; --c0a:rgba(255,61,31,.3); --c0b:rgba(255,61,31,.14); --hia:rgba(255,210,63,.32); --hib:rgba(255,210,63,.12);
  --display:"Syncopate","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:host{display:block;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
*{box-sizing:border-box}
.app{position:absolute;inset:0;overflow:hidden}
.bgc{position:absolute;inset:0;background:radial-gradient(ellipse 60% 46% at 38% 48%,var(--c0b),transparent 72%),radial-gradient(ellipse 40% 36% at 72% 52%,var(--hib),transparent 70%),linear-gradient(180deg,#07060b,#0a0710 50%,#07060b);transition:background .6s}
.wall{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.wall.drag{cursor:grabbing}
.cshade{position:absolute;inset:0;pointer-events:none}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;mix-blend-mode:screen}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 76% 70% at 50% 50%,transparent 60%,rgba(0,0,0,.6) 100%)}
.nr{position:absolute;inset:0;pointer-events:none}
.fit{position:absolute;inset:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.fit-in{position:relative;width:100%;height:100%}
.board{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));pointer-events:none}
.pe{pointer-events:auto}

/* ---------- 决策卡（DOM，matrix3d 贴到透视墙上） ---------- */
.nd{position:absolute;left:0;top:0;width:420px;height:160px;transform-origin:0 0;padding:12.6px 16.8px 11.2px;display:flex;flex-direction:column;gap:8.4px;
  background:linear-gradient(180deg,var(--c0b),rgba(13,10,19,.9) 55%,rgba(9,7,14,.92));border:1.4px solid var(--c0a);color:var(--fg-2);font:500 16.8px/1.2 var(--mono);
  box-shadow:inset 0 1.4px 0 rgba(255,255,255,.05);backface-visibility:hidden;will-change:transform;contain:layout paint}
.nd::before,.nd::after{content:"";position:absolute;width:14px;height:14px;border:2.8px solid var(--c0);opacity:.75}
.nd::before{left:-2.8px;top:-2.8px;border-right:0;border-bottom:0}
.nd::after{right:-2.8px;bottom:-2.8px;border-left:0;border-top:0}
.nd-h{display:flex;align-items:center;gap:11.2px;white-space:nowrap;min-width:0}
.nd-h i{flex:none;width:11.2px;height:11.2px;background:var(--c0);box-shadow:0 0 8.4px var(--c0)}
.nd-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk);font-weight:500;font-size:21px;letter-spacing:.02em;color:var(--fg)}
.nd-h b small{font-family:var(--mono);font-size:19.6px;font-weight:500;color:var(--fg);letter-spacing:0}
.nd-h span{flex:none;font-size:13.3px;letter-spacing:.14em;color:var(--fg-3);border:1.4px solid var(--line-2);padding:1.4px 7px}
.nd-kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:2.8px 11.2px;font-size:15.4px;color:var(--fg-3);white-space:nowrap}
.nd-kv em{font-style:normal;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.nd-f{margin-top:auto;display:flex;align-items:flex-end;gap:11.2px;font-size:14px;color:var(--fg-3);white-space:nowrap}
.nd-g{flex:1;display:flex;gap:2.2px;height:46px;align-items:flex-end;border-bottom:1px solid var(--c0a)}
.nd-g u{flex:1;background:var(--fil);opacity:.42;text-decoration:none}
.nd-f s{text-decoration:none;width:9.8px;height:9.8px;border-radius:50%;background:var(--fg-3)}
.nd-x{display:none;position:absolute;right:14px;bottom:9.8px;font:700 16.8px/1 var(--cjk);color:#160f06;background:var(--hi);padding:4.2px 8.4px;white-space:nowrap;box-shadow:0 0 16.8px var(--hi)}
.nd.ping{border-color:var(--fil);box-shadow:0 0 18px var(--c0a),inset 0 0 22px var(--c0b);transition:border-color .2s,box-shadow .2s}
.nd.ping .nd-h i{background:var(--fil);box-shadow:0 0 10px var(--fil)}
.nd.ping .nd-g u{opacity:.8}
.nd.blip .nd-f s{background:var(--ok);box-shadow:0 0 8.4px var(--ok)}
.nd.on{border:2.8px solid var(--hi);background:linear-gradient(180deg,var(--hia),var(--hib) 70%,rgba(11,9,17,.88));box-shadow:0 0 30.8px var(--hia),inset 0 0 36.4px var(--hib)}
.nd.on::before,.nd.on::after{border-color:#fff;opacity:1}
.nd.on .nd-h b,.nd.on .nd-h b small{color:#fff}
.nd.on .nd-h i{background:#fff;box-shadow:0 0 11.2px var(--hi)}
.nd.on .nd-h span{color:var(--hi);border-color:var(--hi)}
.nd.on .nd-kv{color:var(--fg-2)}
.nd.on .nd-kv em{color:var(--fg)}
/* 点亮后的柱状图：整根拉满再上下跳，每根节奏不同 */
.nd.on .nd-g u{height:100%!important;background:linear-gradient(0deg,var(--hib),var(--hi) 70%,#fff);opacity:.95;transform-origin:50% 100%;animation:ionbar var(--d,1.1s) ease-in-out infinite alternate}
.nd.hot .nd-g u{animation-duration:calc(var(--d,1.1s) * .7)}
@keyframes ionbar{0%{transform:scaleY(.22)}100%{transform:scaleY(1)}}
.nd.on .nd-f s{background:var(--hi);box-shadow:0 0 8.4px var(--hi)}
.nd.on .nd-x{display:block}
.nd.hot{box-shadow:0 0 47.6px var(--hi),inset 0 0 47.6px var(--hia);animation:ionhot .5s ease-in-out infinite alternate}
.nd.hold .nd-x{background:var(--hold);box-shadow:0 0 16.8px var(--hold)}
@keyframes ionhot{from{border-color:var(--hi)}to{border-color:#fff}}

/* ---------- 浮在电路上的 HUD：没有框，只有暗角、细线和焊盘；焊盘由 WebGL 走线接进电路 ---------- */
.shade-tl{position:absolute;left:-60px;top:-40px;width:900px;height:420px;background:radial-gradient(ellipse 700px 340px at 0 0,rgba(var(--sh),.55),rgba(var(--sh),.3) 50%,rgba(var(--sh),0) 82%)}
.shade-tr{position:absolute;right:-60px;top:-40px;width:560px;height:440px;background:radial-gradient(ellipse 460px 380px at 100% 0,rgba(var(--sh),.5),rgba(var(--sh),.28) 50%,rgba(var(--sh),0) 84%)}
.shade-b{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(0deg,rgba(var(--sh),.6),rgba(var(--sh),.25) 50%,rgba(var(--sh),0))}
.hd{position:absolute;left:28px;top:22px;width:max-content;text-shadow:0 0 6px var(--bg),0 0 16px var(--bg)}
.eb{width:max-content;font-size:10px;letter-spacing:.26em;color:var(--fg-3);white-space:nowrap}
.eb b{color:var(--hi);font-weight:500}
.hd h1{margin:12px 0 0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:.05em;color:var(--fg)}
.hd h1 span{display:block;width:max-content;white-space:nowrap}
.hd h1 .l1{display:flex;align-items:center;width:max-content}
.hd h1 em{font-style:normal;font-family:var(--cjk);font-weight:900;font-size:36px;line-height:1;letter-spacing:.08em;margin-left:22px;text-shadow:none;background:linear-gradient(90deg,var(--hi),var(--c0));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px var(--c0a))}
.rule{position:relative;width:560px;height:9px;margin-top:10px}
.rule::before{content:"";position:absolute;left:0;right:8px;top:4px;height:1px;background:linear-gradient(90deg,var(--hi),var(--c0) 55%,var(--c0a));box-shadow:0 0 8px var(--c0)}
.rule::after{content:"";position:absolute;left:0;top:1px;width:46px;height:7px;background:repeating-linear-gradient(90deg,var(--hi) 0 3px,transparent 3px 7px);opacity:.85}
.pad{position:absolute;width:9px;height:9px;border:1.5px solid var(--hi);border-radius:50%;background:var(--bg);box-shadow:0 0 10px var(--hi)}
.rule .pad{right:0;top:0}
.sub{width:max-content;margin-top:10px;font-family:var(--cjk);font-size:14px;letter-spacing:.06em;color:var(--fg-2);white-space:nowrap}
.case{display:flex;align-items:center;gap:12px;margin-top:16px;white-space:nowrap}
.cpill{flex:none;font:700 12px/1 var(--mono);letter-spacing:.1em;color:#120c04;background:var(--hi);padding:6px 9px;box-shadow:0 0 18px var(--hia)}
.case b{font-family:var(--display);font-weight:700;font-size:21px;line-height:1;letter-spacing:.06em;color:var(--fg);text-shadow:0 0 18px var(--c0a),0 0 6px var(--bg)}
.case em{font-style:normal;font-family:var(--cjk);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--hi)}
.cpath{margin-top:9px;font-family:var(--cjk);font-size:13px;color:var(--fg-2);white-space:nowrap}
.cpath i{font-style:normal;color:var(--hi);margin:0 7px}
.cpath b{font-weight:500;color:var(--fg)}
.ucd{display:flex;align-items:center;gap:6px;margin-top:12px}
.ucd i{width:17px;height:17px;border-radius:3px;background:var(--uc);opacity:.45;transition:opacity .3s,transform .3s;cursor:pointer;pointer-events:auto}
.ucd i:hover{opacity:.95;transform:scale(1.18)}
.ucd i.done{opacity:.8}
.ucd i.on{opacity:1;transform:scale(1.28);box-shadow:0 0 12px var(--uc)}
.ucd span{margin-left:8px;font-size:9.5px;letter-spacing:.14em;color:var(--fg-3)}
.sub2{width:max-content;margin-top:10px;font-size:10px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.sub2 b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- 右上按钮（与 03–07 同款，去掉底色） ---------- */
.tools{position:absolute;right:28px;top:16px;display:flex;gap:6px}
button.tb{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--fg-2);background:rgba(8,6,12,.45);border:1px solid rgba(210,200,255,.26);padding:8px 11px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(2px)}
button.tb b{color:var(--fg);font-weight:700;font-family:var(--cjk);margin-left:6px;letter-spacing:.04em}
button.tb:hover{border-color:var(--hi);color:var(--fg)}
button.tb:focus-visible{outline:1px solid var(--hi);outline-offset:2px}
.strip{position:absolute;right:28px;top:54px;display:flex;gap:16px;font-size:9.5px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap;text-shadow:0 0 6px var(--bg)}
.strip b{color:var(--fg);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.strip .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}

/* 右上读数：右对齐的浮动数字，左侧焊盘接电路 */
.hud{position:absolute;right:28px;top:94px;width:300px;display:flex;flex-direction:column;gap:14px;text-shadow:0 0 6px var(--bg),0 0 14px var(--bg)}
.ro{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-left:24px}
.ro .pad{left:0;top:26px}
.ro::before{content:"";position:absolute;left:9px;right:0;top:30px;height:1px;background:linear-gradient(90deg,var(--c0a),transparent 30%,transparent 62%,var(--line-2))}
.ro-l{font-size:9px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.ro-l em{font-style:normal;font-family:var(--cjk);font-size:10.5px;color:var(--fg-2);letter-spacing:.08em;margin-right:6px}
.ro-v{display:flex;align-items:center;gap:10px;margin-top:6px}
.ro-v b{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.01em;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro-v small{font-size:13px;color:var(--fg-3);margin-left:-6px}
.ro-v canvas{width:120px;height:26px}
.ro-v .glow{color:var(--hi);text-shadow:0 0 16px var(--hia),0 0 4px var(--bg)}
.badge{font:700 11px/1 var(--mono);letter-spacing:.12em;color:#140e04;background:var(--ok);padding:4px 8px;box-shadow:0 0 12px rgba(93,255,168,.5);text-shadow:none}
.badge.hold{background:var(--hold);box-shadow:0 0 12px var(--hold)}
.ro-b{width:170px;height:3px;background:rgba(255,255,255,.08);position:relative}
.ro-b i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--c0),var(--hi));box-shadow:0 0 8px var(--hi);transition:width .4s}
.ro-b em{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--fg);left:85%}
.ro.flash .ro-v b{animation:ionflash .6s ease-out}
@keyframes ionflash{0%{color:#fff;text-shadow:0 0 22px var(--hi)}100%{}}

/* 底部：列标签 + 日志滚动 + 状态行，都不加框 */
.colfoot{position:absolute;left:0;right:0;bottom:36px;height:22px}
.ch{position:absolute;top:0;transform:translateX(-50%);display:flex;align-items:baseline;gap:6px;font-size:9.5px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap;padding:3px 9px 4px;border-top:1px solid var(--line-2);text-shadow:0 0 6px var(--bg);transition:color .25s,border-color .25s}
.ch span{font-family:var(--cjk);font-size:11.5px;letter-spacing:.06em;color:var(--fg-2)}
.ch.done{color:var(--hi);border-color:var(--c0a)}
.ch.on{color:var(--hi);border-color:var(--hi);border-top-width:2px}
.ch.on span{color:var(--fg)}
.tick{position:absolute;left:28px;bottom:70px;display:flex;flex-direction:column-reverse;gap:2px;font-size:10px;line-height:15px;white-space:nowrap;text-shadow:0 0 6px var(--bg)}
.lr{display:grid;grid-template-columns:58px 52px auto;gap:8px;color:var(--fg-3)}
.lr .a{color:var(--hi);letter-spacing:.06em}
.lr .x{font-family:var(--cjk);color:var(--fg-2)}
.lr:nth-child(2){opacity:.6}
.lr:nth-child(3){opacity:.32}
.lr.fresh .x{color:var(--fg)}
.sb{position:absolute;left:28px;right:28px;bottom:12px;display:flex;align-items:center;justify-content:center;gap:28px;font-size:9.5px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-shadow:0 0 6px var(--bg)}
.sb b{color:var(--fg-2);font-weight:500;font-variant-numeric:tabular-nums}
.sb .on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}
.sb .wm{font-family:var(--display);font-size:9px;letter-spacing:.3em;color:#5a536c}

/* ---------- 窄屏 / 竖屏 ---------- */
.mini{display:none;position:absolute;inset:0;flex-direction:column;justify-content:space-between;pointer-events:none;padding-block:10px}
.narrow .board{display:none}
.narrow .mini{display:flex}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:linear-gradient(180deg,rgba(var(--sh),.92),rgba(var(--sh),.55) 70%,transparent);margin-inline:-16px;margin-top:-10px;padding:10px 16px 18px}
.m-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;line-height:1.1;text-shadow:0 0 8px var(--bg)}
.m-title i{display:block;font-style:normal;font-family:var(--cjk);font-weight:700;font-size:12px;color:var(--hi);letter-spacing:.12em;margin-top:5px}
.m-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:210px}
.m-btns .tb{padding:6px 8px;font-size:10px}
.m-case{display:flex;align-items:center;gap:8px;margin-top:10px}
.m-case .cpill{font-size:10px;padding:5px 7px}
.m-case b{font-family:var(--display);font-size:13px;letter-spacing:.05em;white-space:nowrap}
.m-bot{background:linear-gradient(0deg,rgba(var(--sh),.94),rgba(var(--sh),.62) 70%,transparent);margin-inline:-16px;padding:24px 16px 0}
.m-cap{font-family:var(--cjk);font-size:12px;color:var(--fg-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-cap i{font-style:normal;color:var(--hi);margin:0 4px}
.m-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line-2);padding-top:8px;margin-top:8px}
.m-stats div{display:grid;gap:2px;min-width:0}
.m-stats span{font-size:9px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap}
.m-stats b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.m-wm{margin-top:6px;font-family:var(--display);font-weight:400;font-size:8.5px;letter-spacing:.3em;color:#453f55;text-align:center}
.glfail{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);max-width:420px;text-align:center;font-family:var(--cjk);font-size:12px;line-height:1.7;color:var(--fg-2);border:1px solid var(--line-2);padding:10px 16px;background:rgba(10,8,15,.88)}
@media (prefers-reduced-motion:reduce){.nd.hot{animation:none}.nd.on .nd-g u{animation:none}.ro.flash .ro-v b{animation:none}.ro-b i{transition:none}}
</style>

<div class="app" id="app">
<div class="bgc" aria-hidden="true"></div>
<div class="wall" id="wall" role="img" aria-label="离子回路：6 列决策卡组成的电路墙，离子光球按状态、提问、推理、决策、闸门、执行一列一列点亮决策节点，每个任务一种颜色。上下拖动或滚轮滑动电路墙，左右拖动改变斜角，双击复位"></div>
<div class="cshade" id="cshade" aria-hidden="true"></div>

  if (host.hidden || document.hidden || !L.ok) { last = 0; return; }
  var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
  last = ts;
  now += dt;
  updateState(dt);
  setCam();
  updateCards(now);
  placeColHeads();
  if (gl) { buildCircuit(now, dt); drawGL(); }
  uiAcc += dt; chAcc += dt; fpsAcc += dt; fpsN++;
  if (chAcc > 0.08) { chAcc = 0; pushSeries(); if (!L.narrow) drawWave(); }
  if (uiAcc > 0.12) { uiAcc = 0; updateUI(); }
  if (fpsAcc > 0.5) { setTxt($("sFps"), String(Math.round(fpsN / fpsAcc))); fpsAcc = 0; fpsN = 0; }
}

/* =====================================================================
   10. 交互：上下拖动 / 滚轮滑动电路墙，左右拖动改斜角，双击复位；视角 / 全屏
   ===================================================================== */
var dragging = false, lastX = 0, lastY = 0;
wall.addEventListener("pointerdown", function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; wall.classList.add("drag"); try { wall.setPointerCapture(e.pointerId); } catch (er) {} });
wall.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  VW.yawOff = clamp(VW.yawOff + dx * 0.0016, -0.45, 0.45);
  VW.man -= dy / (W.ROW * colK(2));
});
function endDrag() { dragging = false; wall.classList.remove("drag"); }
wall.addEventListener("pointerup", endDrag); wall.addEventListener("pointercancel", endDrag);
wall.addEventListener("dblclick", function () { VW.yawOff = 0; VW.man = 0; VW.zoom = 1; });
wall.addEventListener("wheel", function (e) { e.preventDefault(); VW.zoom = clamp(VW.zoom * Math.exp(-clamp(e.deltaY, -120, 120) * 0.0015), 0.55, 1.7); }, { passive: false });
function syncButtons() {
  [].forEach.call(SR.querySelectorAll('[data-f="mode"]'), function (b) { b.textContent = MODES[modeI].zh; });
  [].forEach.call(SR.querySelectorAll('[data-f="scheme"]'), function (b) { b.textContent = PAL_MODE === "fixed" ? "固定" : "轮播"; });
}
function applyBase(useGold) {
  var B = useGold ? GOLD_BASE : ORIG_BASE, st = app.style;
  st.setProperty("--bg", B.bg); st.setProperty("--panel", B.panel); st.setProperty("--card", B.card);
  st.setProperty("--line", B.line); st.setProperty("--line-2", B.line2);
  st.setProperty("--fg", B.fg); st.setProperty("--fg-2", B.fg2); st.setProperty("--fg-3", B.fg3); st.setProperty("--ok", B.ok);
  AMBER = useGold ? hex3("#E23A3A") : hex3("#ffb020");
  st.setProperty("--sh", useGold ? "19,16,10" : "5,4,9"); st.setProperty("--hold", useGold ? "#E23A3A" : "#ffb020");
}
function syncDots() {
  UCD.forEach(function (d2, j) {
    if (PAL_MODE === "fixed") setCls(d2, j === PAL_PICK ? "on" : "");
    else setCls(d2, j === ST.ci ? "on" : (j < ST.ci ? "done" : ""));
  });
}
function savePal() { try { localStorage.setItem("agent-ion-pal", JSON.stringify({ m: PAL_MODE, p: PAL_PICK })); } catch (e) {} }
function applyPick(p) {
  PAL_PICK = p; PAL_MODE = "fixed";
  applyBase(p >= 12);
  recolor(); syncDots(); syncButtons(); savePal();
}
function toggleScheme() {
  if (PAL_MODE === "fixed") { PAL_MODE = "cycle"; applyBase(false); }
  else {
    PAL_MODE = "fixed";
    if (PAL_PICK < 0) PAL_PICK = ST.ci >= 0 ? ST.ci : 0;
    applyBase(PAL_PICK >= 12);
  }
  recolor(); syncDots(); syncButtons(); savePal();
}
function act(name) {
  if (name === "mode") { modeI = (modeI + 1) % MODES.length; VW.yawOff = 0; VW.zoom = 1; }
  else if (name === "scheme") toggleScheme();
  else if (name === "full") {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () { var b = SR.querySelector('[data-f="full"]'); b.textContent = "不支持"; setTimeout(function () { b.textContent = "全屏"; }, 1500); });
    } catch (e) { /* 部分窗口不允许全屏 */ }
  }
  syncButtons();
}
[].forEach.call(SR.querySelectorAll("[data-act]"), function (b) { b.addEventListener("click", function () { act(b.getAttribute("data-act")); }); });
document.addEventListener("fullscreenchange", function () { var b = SR.querySelector('[data-f="full"]'); if (b) b.textContent = document.fullscreenElement ? "退出全屏" : "全屏"; });
document.addEventListener("keydown", function (e) {
  if (host.hidden) return;
  var tag = (e.target && e.target.tagName) || "";
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "v" || e.key === "V") act("mode");
});

/* ---------- 开场 ---------- */
try {
  var sp = JSON.parse(localStorage.getItem("agent-ion-pal") || "null");
  if (sp && sp.m === "fixed" && sp.p >= 0) { PAL_PICK = sp.p; PAL_MODE = "fixed"; applyBase(PAL_PICK >= 12); }
  else applyBase(false);
} catch (e) { applyBase(false); }
syncDots();
recolor();
setTxt($("clock"), hms()); setInterval(function () { if (!host.hidden) setTxt($("clock"), hms()); }, 1000);
syncButtons();
var roT = 0;
new ResizeObserver(function () { clearTimeout(roT); roT = setTimeout(layout, 60); }).observe(host);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });
layout();
log("BUS", "离子母线上线 · 6 个环节 · 12 类工作用例无限连播");
startCase(0);
ST.t = DUR.link * 0.9;
// 调试用：document.getElementById('host-ion').__next() / .__hop(3) / .__ff(2)
host.__next = function () { startCase((ST.ci + 1) % CASES.length); ST.t = DUR.link * 0.99; };
host.__case = function (i) { startCase(i); ST.t = DUR.link * 0.99; };
host.__perf = function (n) { var t0 = performance.now(), i; for (i = 0; i < n; i++) { now += 0.016; updateState(0.016); setCam(); updateCards(now); placeColHeads(); } var t1 = performance.now(); for (i = 0; i < n; i++) { now += 0.016; buildCircuit(now, 0.016); } var t2 = performance.now(); return { cards: (t1 - t0) / n, circuit: (t2 - t1) / n, rib: nRib, spr: nSpr }; };
host.__link = function (i, f) { startCase(i); ST.t = DUR.link * f - 0.05; updateState(0.05); };
host.__hop = function (h) { ST.ph = "run"; ST.hop = h; ST.sub = "work"; ST.st = 0.2; ST.lit = h; ST.recol = true; recolor(); WAVE.t0 = -9; COL.c0 = TGT.c0; COL.hi = TGT.hi; COL.fil = TGT.fil; VW.s = ST.PR[h]; VW.tx = colX(h) + 0.35; };
host.__arrive = function (h) { RINGS.push({ x: colX(h) - W.CW / 2 + W.CW * 0.18, y: rowY(ST.PR[h]), t0: now - 0.35, c: COL.hi.slice() }); };
host.__ff = function (sec) { for (var t = 0; t < sec; t += 0.05) { now += 0.05; updateState(0.05); pushSeries(); } updateUI(); };
host.__st = function () { return { ci: ST.ci, seg: ST.seg, ph: ST.ph, hop: ST.hop, sub: ST.sub, s: VW.s, rib: nRib, spr: nSpr, glow: nGlow, vis: VISROWS.map(function (r) { return r ? r.join("-") : "x"; }).join(" ") }; };
requestAnimationFrame(frame);
}

/* ===== 独立启动：挂载 ION 主题 ===== */
(function () {
  "use strict";
  var host = document.getElementById("host-ion");
  var SR = host.attachShadow({ mode: "open" });
  SR.appendChild(document.getElementById("tpl-ion").content.cloneNode(true));
  try { mountIon(host, SR); } catch (e) { console.error(e); }
})();
</script>
